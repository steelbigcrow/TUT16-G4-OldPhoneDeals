spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: old-phone-deals
  
  # MongoDB 配置
  data:
    mongodb:
      # 自动创建索引（用于 createdAt / updatedAt）
      auto-index-creation: true
  
  # 邮件服务(SendGrid SMTP)
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    # 默认发件人
    from: ${FROM_EMAIL:noreply@oldphonedeals.com}
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 1MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5000
          max-interval: 45000
          multiplier: 3.0

# 服务器配置
server:
  port: ${PORT:8080}
  # 错误信息输出
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never  # 默认不返回堆栈
    include-exception: false

# JWT 配置
jwt:
  secret: ${JWT_SECRET:}  # 必须在环境变量中配置
  expiration: 604800000  # 7 天(毫秒)

# 前端 URL（用于 CORS）
frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

# 文件存储
file:
  upload:
    # 上传根目录（最佳实践：不要把 images 写进 dir，images 由服务层作为子目录管理）
    dir: ${UPLOAD_DIR:./uploads}
    max-size: 10485760  # 10MB

# 日志配置
logging:
  level:
    root: INFO
    com.oldphonedeals: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

# Actuator 配置(可按需开启)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  e2e:
    enabled: ${APP_E2E_ENABLED:false}
  mongo:
    transactions:
      enabled: ${APP_MONGO_TRANSACTIONS_ENABLED:false}
